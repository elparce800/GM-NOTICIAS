name: Actualizar noticias

on:
  schedule:
    # GitHub retrasa o se salta a veces las ejecuciones programadas, así que se
    # intenta cada hora de 5:17 a. m. a 6:17 p. m. (hora de Lima). Cada intento solo
    # descarga noticias si la edición del día no existe, y solo publica el sitio si
    # la web todavía no muestra la edición de hoy.
    - cron: "17 10-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ver si la edición de hoy ya existe y ya está en la web
        id: hoy
        run: |
          HOY=$(TZ=America/Lima date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "site/data/archivo/$HOY.json" ]; then
            echo "hecha=true" >> "$GITHUB_OUTPUT"
            echo "La edición de hoy ya existe en el repositorio."
            WEB=$(curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/noticias.json?v=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin)['actualizado'][:10])" || true)
            if [ "$WEB" = "$HOY" ]; then
              echo "publicada=true" >> "$GITHUB_OUTPUT"
              echo "La web ya muestra la edición de hoy; nada que hacer."
            fi
          fi

      - run: pip install -r requirements.txt
        if: steps.hoy.outputs.hecha != 'true'

      - name: Descargar y resumir noticias
        if: github.event_name != 'push' && steps.hoy.outputs.hecha != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/actualizar.py

      - name: Guardar la edición en el repositorio
        if: github.event_name != 'push' && steps.hoy.outputs.hecha != 'true'
        run: |
          git config user.name "gm-noticias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data
          git diff --cached --quiet || git commit -m "Edición $(TZ=America/Lima date +%F)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.hoy.outputs.publicada != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.hoy.outputs.publicada != 'true'
        with:
          path: site
      - id: deploy
        if: steps.hoy.outputs.publicada != 'true'
        uses: actions/deploy-pages@v4
