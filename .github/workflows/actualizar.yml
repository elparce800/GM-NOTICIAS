name: Actualizar noticias

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. hora de Lima
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Descargar y resumir noticias
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/actualizar.py

      - name: Guardar la edición en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "gm-noticias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Edición $(TZ=America/Lima date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
